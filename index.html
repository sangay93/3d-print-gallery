<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Print Gallery</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>3D Print Gallery</h1>
  <p>Explore models and connect with the artist</p>
</header>

<!-- MAIN LAYOUT -->
<div class="layout">

  <!-- LEFT: GALLERY -->
  <div class="left">
    <div id="gallery"></div>
  </div>

  <!-- RIGHT: OPTIONAL BRAND AREA -->
  <div class="right"></div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">

  <div class="lightbox-content">

    <span id="close">&times;</span>

    <img id="lightbox-img">
    <h2 id="lightbox-title"></h2>

    <button id="want-btn">Connect with Artist</button>

    <a id="whatsapp-btn" target="_blank">
      <button class="wa">WhatsApp</button>
    </a>

    <a id="email-btn">
      <button class="email">Email</button>
    </a>

    <form id="order-form">
  <input type="text" id="name" placeholder="Your Name" required>

  <input type="email" id="user-email" placeholder="Your Email" required>

  <textarea id="message" placeholder="Your message..." required></textarea>

  <button type="submit">Send Request</button>
</form>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
