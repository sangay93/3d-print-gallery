<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Print Gallery</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>3D Print Gallery</h1>
  <p>Explore models and connect with the artist</p>
</header>

<!-- MAIN LAYOUT -->
<div class="layout">

  <!-- LEFT: GALLERY -->
  <div class="left">
    <div id="gallery"></div>
  </div>

  <!-- RIGHT: OPTIONAL BRAND AREA -->
  <div class="right"></div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">

  <div class="lightbox-content">

    <span id="close">&times;</span>

    <img id="lightbox-img">
    <h2 id="lightbox-title"></h2>

    <button id="want-btn">Connect with Artist</button>

    <a id="whatsapp-btn" target="_blank">
      <button class="wa">WhatsApp</button>
    </a>

    <a id="email-btn">
      <button class="email">Email</button>
    </a>   

  </div>
  <div class="form-container">
  <iframe
    src="https://docs.google.com/forms/d/e/1FAIpQLScSRBVwEU0z-hYmS8uQ8LMuacjNZd8CEV05L-rq7x0n1muqSA/viewform?embedded=true"
    width="100%"
    height="900"
    frameborder="0"
    marginheight="0"
    marginwidth="0">
    Loading…
  </iframe>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
